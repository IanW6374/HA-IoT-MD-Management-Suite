name: IoT MD Management Suite
version: 2.2.0
slug: iot_md_management
description: Fleet, policy, staged rollout and secure release management for IoT MD devices
url: https://github.com/IanW6374/HA-IoT-MD-Management-Suite
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
stage: experimental
startup: services
boot: auto
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: IoT MD Management
panel_admin: true
homeassistant_api: true
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: TLS release endpoint used by IoT MD devices
map:
  - ssl:ro
  - share:rw
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  poll_interval_s: 60
  request_timeout_s: 10
  event_retention: 5000
  github_sync_enabled: false
  github_repository: IanW6374/IoT-Modular-Device
  release_base_url: https://homeassistant.local:8443
  release_sync_interval_s: 3600
  auto_promote_stable: false
  auto_promote_beta: false
schema:
  certfile: str
  keyfile: str
  poll_interval_s: int(10,3600)
  request_timeout_s: int(2,120)
  event_retention: int(100,50000)
  github_sync_enabled: bool
  github_repository: str
  github_token: password?
  release_base_url: url
  release_sync_interval_s: int(300,86400)
  auto_promote_stable: bool
  auto_promote_beta: bool
