name: IoT MD Management Suite
version: 3.2.13
slug: iot_md_management
description: Fleet, policy, staged rollout and secure release management for IoT MD devices
url: https://github.com/IanW6374/HA-IoT-MD-Management-Suite
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
stage: experimental
startup: services
boot: auto
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: IoT MD Management
panel_admin: true
homeassistant_api: true
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: TLS release endpoint used by IoT MD devices
map:
  - ssl:ro
  - share:rw
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  poll_interval_s: 60
  request_timeout_s: 30
  device_worker_limit: 8
  progress_interval_s: 5
  progress_timeout_s: 5
  update_tracking_method: api
  mqtt_host: mqtt-broker.home.arpa
  mqtt_port: 8883
  mqtt_username: ''
  mqtt_password: ''
  mqtt_ca_path: ''
  mqtt_client_cert_path: ''
  mqtt_client_key_path: ''
  mqtt_progress_topic: iotmd/update-operations/{device_id}/{operation_id}
  mqtt_report_stale_s: 15
  mqtt_snapshot_interval_s: 60
  device_api_ca_path: /ssl/iot-md-ca.pem
  device_api_client_cert_path: /ssl/iot-md-fleet.pem
  device_api_client_key_path: /ssl/iot-md-fleet-key.pem
  event_retention: 5000
  github_sync_enabled: false
  github_repository: IanW6374/IoT-Modular-Device
  release_base_url: https://iot-upgrade.home.arpa:8443
  release_sync_interval_s: 3600
  auto_promote_alpha: false
  auto_promote_beta: false
  auto_promote_stable: false
schema:
  certfile: str
  keyfile: str
  poll_interval_s: int(10,3600)
  request_timeout_s: int(2,120)
  device_worker_limit: int(2,32)
  progress_interval_s: int(1,30)
  progress_timeout_s: int(2,15)
  update_tracking_method: list(api|mqtt)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ca_path: str?
  mqtt_client_cert_path: str?
  mqtt_client_key_path: str?
  mqtt_progress_topic: str
  mqtt_report_stale_s: int(10,120)
  mqtt_snapshot_interval_s: int(15,300)
  device_api_ca_path: str
  device_api_client_cert_path: str
  device_api_client_key_path: str
  event_retention: int(100,50000)
  github_sync_enabled: bool
  github_repository: str
  github_token: password?
  release_base_url: url
  release_sync_interval_s: int(300,86400)
  auto_promote_alpha: bool
  auto_promote_beta: bool
  auto_promote_stable: bool
