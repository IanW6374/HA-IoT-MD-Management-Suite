configuration:
  certfile:
    name: TLS certificate file
    description: Certificate chain filename in Home Assistant /ssl for the device release endpoint.
  keyfile:
    name: TLS private key file
    description: Private key filename in Home Assistant /ssl for the device release endpoint.
  poll_interval_s:
    name: Device poll interval
    description: Seconds between fleet inventory and health polls.
  request_timeout_s:
    name: Device request timeout
    description: Maximum seconds for each Device API HTTP read, including its response body. Live discovery and final health confirmation have independent deadlines; routine progress uses the shorter live read budget.
  device_worker_limit:
    name: Maximum concurrent device handlers
    description: Bounds scheduled device work and API requests. Half the handlers are reserved for live progress; slow background work cannot consume them.
  progress_interval_s:
    name: Live progress interval
    description: Seconds between successful progress reads during active actions, subject to bounded worker capacity. Recently responsive devices retry promptly; unreachable devices use bounded exponential backoff.
  progress_timeout_s:
    name: Live progress read budget
    description: Seconds for one live status read, including waiting for a busy device. Discovery and final health confirmation use separate request-timeout budgets. Uncertain mutations are reconciled, never automatically replayed.
  update_tracking_method:
    name: Update progress transport
    description: API (default) uses authenticated snapshots. MQTT uses authenticated push reports with API reconciliation; update commands still use the Device API. Changes apply to new actions.
  mqtt_host:
    name: MQTT broker hostname
    description: Configurable trusted broker for optional update reports. Devices must already use this same broker; Management does not overwrite their MQTT settings.
  mqtt_port:
    name: MQTT broker TLS port
    description: Recommended 8883. TLS certificate and hostname verification are always required; there is no insecure mode.
  mqtt_username:
    name: MQTT username
    description: Optional broker account allowed to subscribe to the progress topic.
  mqtt_password:
    name: MQTT password
    description: Optional broker account password. Never included in device reports or diagnostics.
  mqtt_ca_path:
    name: MQTT broker CA path
    description: Optional CA bundle in /ssl. Leave empty to use system trust roots.
  mqtt_client_cert_path:
    name: MQTT client certificate path
    description: Optional client certificate for mutual TLS broker authentication; configure its matching private key too.
  mqtt_client_key_path:
    name: MQTT client private key path
    description: Optional private key for the MQTT client certificate. Kept in /ssl, never sent to devices.
  mqtt_progress_topic:
    name: MQTT progress topic template
    description: Recommended iotmd/update-operations/{device_id}/{operation_id}. Both placeholders are required once, in separate complete levels. No wildcards; Management derives its subscription.
  mqtt_report_stale_s:
    name: MQTT report stale threshold
    description: Seconds without a new authenticated report before falling back to normal API progress reads. Recommended 15.
  mqtt_snapshot_interval_s:
    name: MQTT API reconciliation interval
    description: Maximum seconds between API snapshots even when MQTT reports are fresh. Recommended 60; cancellation always reconciles over API too.
  device_api_ca_path:
    name: Device API CA path
    description: CA bundle in /ssl used to verify every managed IoT-MD Device API.
  device_api_client_cert_path:
    name: Device API client certificate path
    description: Fleet client certificate chain in /ssl used for every managed device.
  device_api_client_key_path:
    name: Device API client key path
    description: Fleet client private key in /ssl used for every managed device.
  event_retention:
    name: Fleet event retention
    description: Maximum number of device events retained in the suite database.
  github_sync_enabled:
    name: Enable GitHub Release synchronization
    description: Allow manual and scheduled import of verified releases from GitHub.
  github_repository:
    name: GitHub release repository
    description: Public source repository in owner/name form.
  github_token:
    name: GitHub API token
    description: Optional read-only token for private access or a higher API rate limit.
  release_base_url:
    name: Device release base URL
    description: Exact HTTPS origin used by devices, including the externally published port.
  release_sync_interval_s:
    name: GitHub synchronization interval
    description: Seconds between automatic GitHub Release inventory checks.
  auto_promote_stable:
    name: 'Auto-promotion: Stable'
    description: Promote the newest newly imported non-prerelease to Stable after verification.
  auto_promote_beta:
    name: 'Auto-promotion: Beta'
    description: Promote the newest newly imported non-Alpha prerelease to Beta after verification.
  auto_promote_alpha:
    name: 'Auto-promotion: Alpha'
    description: Promote the newest newly imported Alpha release to Alpha after verification.
network:
  8443/tcp: IoT-MD signed release endpoint
