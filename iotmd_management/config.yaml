name: IoTMD Management Suite
version: 2.1.0
slug: iotmd_management
description: Fleet, policy, staged rollout and secure release management for IoTMD
url: https://github.com/IanW6374/HA-IoTMD-Management-Suite
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: IoTMD Management
panel_admin: true
homeassistant_api: true
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: TLS release endpoint used by IoTMD devices
map:
  - ssl:ro
  - share:rw
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  poll_interval_s: 60
  request_timeout_s: 10
  event_retention: 5000
schema:
  certfile: str
  keyfile: str
  poll_interval_s: int(10,3600)
  request_timeout_s: int(2,120)
  event_retention: int(100,50000)
